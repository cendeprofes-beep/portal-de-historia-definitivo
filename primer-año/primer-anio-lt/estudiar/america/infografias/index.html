<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>América Antigua</title>
  <link rel="stylesheet" href="../../../css/estilos.css">
  <style>
    body {
      background-image: url('../../../imagenes/mapa.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      margin-top: 30px;
    }

    .item {
      width: 250px;
    }

    .item img {
      width: 100%;
      border: 2px solid gold;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .item img:hover {
      transform: scale(1.05);
    }

    .titulo {
  margin-top: 10px;
  font-size: 18px;
  color: #FFD966;           /* amarillo fuerte */
  font-weight: bold;
  background-color: #800000; /* bordó oscuro */
  display: inline-block;     /* el fondo se ajusta al texto */
  padding: 5px 12px;         /* espacio interior */
  border-radius: 8px;        /* esquinas redondeadas */
  text-shadow: 1px 1px 1px black;
}

    /* MODAL */
    .modal {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.9);
  overflow: hidden; /* 👈 IMPORTANTE */
}

  .modal img {
  display: block;
  max-width: 90%;
  max-height: 90%;
  margin: auto;
  cursor: zoom-in;
  transition: transform 0.2s ease;
user-select: none;
  -webkit-user-drag: none;
}

    .cerrar {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 30px;
      color: white;
      cursor: pointer;
    }

.flecha {
  position: absolute;
  top: 50%;
  font-size: 40px;
  color: white;
  cursor: pointer;
  user-select: none;
  transform: translateY(-50%);
  z-index: 10000;
}

.izquierda {
  left: 20px;
}

.derecha {
  right: 20px;
}
.breadcrumb {
  margin: 20px;
  padding: 10px 15px;
  font-size: 18px;
  color: #ddd;
  background-color: rgba(0,0,0,0.6);
  border-radius: 8px;
  text-align: left;
}

.breadcrumb a {
  color: gold;
  text-decoration: none;
}

.breadcrumb span {
  color: white;
  font-weight: bold;
}
  </style>

</head>
<body>
<div class="barra-superior">
  <a href="../../../explorar/lineas-tiempo/cronos3.html" class="nav-btn izquierda">← Volver a la línea de tiempo</a>
  <a href="../../../../../index.html" class="nav-btn derecha">A Página Principal</a>
</div>
<div class="breadcrumb">
  <span>América</span> >
  <span>Infografías</span>
</div>


<div class="galeria">

 <div class="item">
  <img src="info23.png" onclick="abrir(this)">
  <div class="titulo">Las primeras civilizaciones de América: originalidad y adaptación</div>
</div>

<div class="item">
  <img src="info30.png" onclick="abrir(this)">
  <div class="titulo">El Imperio azteca: poder militar, tributo y organización jerárquica</div>
</div>

<div class="item">
  <img src="info31.png" onclick="abrir(this)">
  <div class="titulo">La formación del Imperio inca: expansión, organización y tributo en trabajo</div>
</div>


</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <span class="cerrar" onclick="cerrar()">&times;</span>

  <span class="flecha izquierda" onclick="anterior()">&#10094;</span>
  <span class="flecha derecha" onclick="siguiente()">&#10095;</span>

  <img id="img-ampliada">
</div>

<script>
// Estado inicial
history.replaceState({ modal: false }, "");

// Abrir imagen
function abrir(img) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("img-ampliada").src = img.src;

  history.pushState({ modal: true }, "");
}

// Cerrar imagen
function cerrar() {
  document.getElementById("modal").style.display = "none";

  if (history.state && history.state.modal) {
    history.back();
  }
}

// Botón atrás
window.onpopstate = function(event) {
  document.getElementById("modal").style.display = "none";
};
let zoom = false;

document.getElementById("img-ampliada").onclick = function() {
  zoom = !zoom;

  if (zoom) {
    this.style.transform = "scale(1.8)";
    this.style.cursor = "zoom-out";
  } else {
    this.style.transform = "scale(1)";
    this.style.cursor = "zoom-in";
  }
};
let imagenes = document.querySelectorAll(".item img");
let indice = 0;

// MODIFICAMOS abrir()
function abrir(img) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("img-ampliada").src = img.src;

  indice = Array.from(imagenes).indexOf(img);

  history.pushState({ modal: true }, "");
}

// SIGUIENTE
function siguiente() {
  indice = (indice + 1) % imagenes.length;
  actualizarImagen();
}

// ANTERIOR
function anterior() {
  indice = (indice - 1 + imagenes.length) % imagenes.length;
  actualizarImagen();
}

// ACTUALIZAR IMAGEN
function actualizarImagen() {
  let img = document.getElementById("img-ampliada");
  img.ondragstart = () => false;
  img.src = imagenes[indice].src;

  // reset zoom
  img.style.transform = "scale(1)";
}let posX = 0;
let posY = 0;
let arrastrando = false;
let inicioX, inicioY;

let img = document.getElementById("img-ampliada");

// Scroll con rueda
document.getElementById("modal").addEventListener("wheel", function(e) {
  if (!zoom) return;

  e.preventDefault();
  posY -= e.deltaY;
  actualizarTransform();
});

// Click y arrastre
img.addEventListener("mousedown", function(e) {
  if (!zoom) return;

  arrastrando = true;
  inicioX = e.clientX;
  inicioY = e.clientY;

  img.style.cursor = "grabbing";
});

document.addEventListener("mousemove", function(e) {
  if (!arrastrando || !zoom) return;

  let dx = e.clientX - inicioX;
  let dy = e.clientY - inicioY;

  inicioX = e.clientX;
  inicioY = e.clientY;

  posX += dx;
  posY += dy;

  actualizarTransform();
});

document.addEventListener("mouseup", function() {
  arrastrando = false;
  img.style.cursor = zoom ? "grab" : "zoom-in";
});

document.addEventListener("mousemove", function(e) {
  if (!arrastrando || !zoom) return;

  let dx = e.clientX - inicioX;
  let dy = e.clientY - inicioY;

  inicioX = e.clientX;
  inicioY = e.clientY;

  posX += dx;
  posY += dy;

  actualizarTransform();
});

function actualizarTransform() {
  img.style.transform = `translate(${posX}px, ${posY}px) scale(${zoom ? 1.8 : 1})`;
}
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    cerrar();
  }
});
</script>

</body>

</html>
