.left-btn {

.right-btn {

.leyenda {

.frame-imagen:hover {

.frame-imagen img {

}
.frame-imagen:hover img {

#modalImagen {

<script>
// EVENTOS SEGÚN CRONOLOGÍA DILECER (CRONO4)
const eventos = [
    { fecha: "1 d.C.", titulo: "Consolidación del Imperio romano bajo Augusto", tipo: "altoimperio", texto: "Augusto establece un sistema de gobierno estable que inaugura la Pax Romana, una época de prosperidad y paz interna que duraría dos siglos." },

    { fecha: "70 d.C.", titulo: "Destrucción del Templo de Jerusalén", tipo: "altoimperio", texto: "Tito sofoca la rebelión judía y destruye el Segundo Templo, dispersando a la población judía (diáspora)." },
    { fecha: "79 d.C.", titulo: "Erupción del Vesubio", tipo: "altoimperio", texto: "El volcán destruye Pompeya y Herculano, enterrándolas bajo cenizas." },

    { fecha: "105 d.C.", titulo: "Difusión del papel en China", tipo: "altoimperio", texto: "Se perfecciona la fabricación de papel, que revolucionará la difusión del conocimiento." },
    { fecha: "117–138 d.C.", titulo: "Adriano", tipo: "altoimperio", texto: "Adriano consolida las fronteras y ordena construir el Muro de Adriano en Britania." },

    { fecha: "235–284 d.C.", titulo: "Crisis del siglo III", tipo: "crisis", texto: "Anarquía militar, invasiones y fragmentación del Imperio." },

    { fecha: "260 d.C.", titulo: "Fragmentación imperial", tipo: "crisis", texto: "Surgen reinos separatistas (Imperio galo, Reino de Palmira)." },
    { fecha: "~300 d.C.", titulo: "Redes comerciales transaharianas", tipo: "crisis", texto: "Expansión del comercio a través del Sáhara, conectando África occidental con el Mediterráneo." },
    { fecha: "284 d.C.", titulo: "Diocleciano", tipo: "tardoimperio", texto: "Diocleciano inicia reformas profundas para estabilizar el Imperio." },
    { fecha: "293 d.C.", titulo: "Tetrarquía", tipo: "tardoimperio", texto: "Establece el gobierno de cuatro emperadores para administrar mejor el territorio." },
    { fecha: "~300 d.C.", titulo: "Auge maya clásico", tipo: "tardoimperio", texto: "La civilización maya alcanza su máximo esplendor cultural y urbano." },
    { fecha: "306 d.C.", titulo: "Ascenso de Constantino", tipo: "tardoimperio", texto: "Constantino se proclama emperador tras la muerte de su padre Constancio Cloro." },

    { fecha: "313 d.C.", titulo: "Edicto de Milán", tipo: "tardoimperio", texto: "Legalización del cristianismo en el Imperio." },

    { fecha: "330 d.C.", titulo: "Consolidación de Constantinopla", tipo: "tardoimperio", texto: "La nueva capital se convierte en el centro político y económico del Imperio de Oriente." },

    { fecha: "378 d.C.", titulo: "Adrianópolis", tipo: "tardoimperio", texto: "Derrota romana frente a los visigodos; muere el emperador Valente." },
    { fecha: "380 d.C.", titulo: "Cristianismo religión oficial", tipo: "tardoimperio", texto: "Teodosio proclama el cristianismo como única religión lícita del Imperio." },
    { fecha: "395 d.C.", titulo: "División definitiva del Imperio", tipo: "tardoimperio", texto: "Tras la muerte de Teodosio, el Imperio se divide en Occidente y Oriente." },
    { fecha: "410 d.C.", titulo: "Saqueo de Roma", tipo: "tardoimperio", texto: "Alarico y sus visigodos saquean la ciudad de Roma." },
    { fecha: "429 d.C.", titulo: "Vándalos en África", tipo: "tardoimperio", texto: "Los vándalos cruzan a África del Norte y fundan un reino independiente." },
    { fecha: "451 d.C.", titulo: "Campos Cataláunicos", tipo: "tardoimperio", texto: "Romanos y visigodos frenan el avance de Atila y sus hunos." },
    { fecha: "455 d.C.", titulo: "Saqueo vándalo de Roma", tipo: "tardoimperio", texto: "Los vándalos saquean Roma durante dos semanas." },
    { fecha: "476 d.C.", titulo: "Caída del Imperio romano de Occidente", tipo: "tardoimperio", texto: "Odoacro depone al último emperador, Rómulo Augústulo, marcando el fin de la Edad Antigua." }
];

const timeline = document.getElementById("timeline");
const wrapper = document.getElementById("timelineWrapper");
const startX = 150;
const step = 135;

eventos.forEach((ev, idx) => {
    const eventoDiv = document.createElement("div");
    eventoDiv.className = "evento";
    const leftPos = startX + idx * step;
    eventoDiv.style.left = leftPos + "px";

    const punto = document.createElement("div");
    punto.className = `punto ${ev.tipo}`;
    eventoDiv.appendChild(punto);

    const infoDiv = document.createElement("div");
    infoDiv.className = "info";
    const fechaSpan = document.createElement("div");
    fechaSpan.className = "fecha";
    fechaSpan.innerText = ev.fecha;
    const tituloSpan = document.createElement("div");
    tituloSpan.className = "titulo";
    tituloSpan.innerText = ev.titulo;
    infoDiv.appendChild(fechaSpan);
    infoDiv.appendChild(tituloSpan);
    eventoDiv.appendChild(infoDiv);

    const offsetLevels = [25, 85, 50, 115];
    const offsetY = offsetLevels[idx % offsetLevels.length];
    infoDiv.style.top = (offsetY + 10) + "px";
    eventoDiv.style.top = "0px";

    const lineaConectora = document.createElement("div");
    lineaConectora.style.position = "absolute";
    lineaConectora.style.left = "50%";
    lineaConectora.style.transform = "translateX(-50%)";
    lineaConectora.style.top = "16px";
    lineaConectora.style.width = "1px";
    lineaConectora.style.height = (offsetY - 6) + "px";
    lineaConectora.style.background = "cyan";
    lineaConectora.style.pointerEvents = "none";
    lineaConectora.style.zIndex = "1";
    eventoDiv.appendChild(lineaConectora);

    eventoDiv.addEventListener("click", () => {
        abrirModal(ev.fecha, ev.titulo, ev.texto);
    });
    timeline.appendChild(eventoDiv);
});

// Períodos del CRONO4
const periodos = [
    { nombre: "Alto Imperio (Pax Romana)", desde: 0, hasta: 16, imagen: "1-ai.jpg" },
    { nombre: "Crisis del siglo III",       desde: 17, hasta: 21, imagen: "2-c3.jpg" },
    { nombre: "Bajo Imperio / Tardoimperio",desde: 22, hasta: 39, imagen: "3-bi.jpg" }
];

const bracketY = 200;
periodos.forEach(p => {
    const xIzq = startX + p.desde * step;
    const xDer = startX + p.hasta * step;
    const ancho = xDer - xIzq;
    const esUnico = ancho === 0;
    const bracketDiv = document.createElement("div");
    bracketDiv.style.position = "absolute";
    bracketDiv.style.left = xIzq + "px";
    bracketDiv.style.top = bracketY + "px";
    bracketDiv.style.width = ancho + "px";
    bracketDiv.style.pointerEvents = "none";
    if (!esUnico) {
        const lineaH = document.createElement("div");
        lineaH.style.position = "absolute";
        lineaH.style.top = "0";
        lineaH.style.left = "0";
        lineaH.style.width = "100%";
        lineaH.style.height = "1px";
        lineaH.style.background = "cyan";
        bracketDiv.appendChild(lineaH);
        const tickIzq = document.createElement("div");
        tickIzq.style.position = "absolute";
        tickIzq.style.left = "0";
        tickIzq.style.top = "-10px";
        tickIzq.style.width = "1px";
        tickIzq.style.height = "10px";
        tickIzq.style.background = "cyan";
        bracketDiv.appendChild(tickIzq);
        const tickDer = document.createElement("div");
        tickDer.style.position = "absolute";
        tickDer.style.right = "0";
        tickDer.style.top = "-10px";
        tickDer.style.width = "1px";
        tickDer.style.height = "10px";
        tickDer.style.background = "cyan";
        bracketDiv.appendChild(tickDer);
    }
    const etiqueta = document.createElement("div");
    etiqueta.style.position = "absolute";
    etiqueta.style.top = "8px";
    etiqueta.style.left = "50%";
    etiqueta.style.transform = "translateX(-50%)";
    etiqueta.style.color = "white";
    etiqueta.style.fontSize = "0.95rem";
    etiqueta.style.fontWeight = "bold";
    etiqueta.style.whiteSpace = "nowrap";
    etiqueta.innerText = p.nombre;
    bracketDiv.appendChild(etiqueta);
    const imgSrc = "../../imagenes/" + p.imagen;
    const frameAncho = 307;
    const centroLocal = ancho / 2;
    const frame = document.createElement("div");
    frame.className = "frame-imagen";
    frame.style.left = (centroLocal - frameAncho / 2) + "px";
    frame.style.top = "45px";
    const imgEl = document.createElement("img");
    imgEl.src = imgSrc;
    imgEl.alt = p.nombre;
    frame.appendChild(imgEl);
    frame.addEventListener("click", () => abrirModalImagen(imgSrc));
    bracketDiv.appendChild(frame);
    timeline.appendChild(bracketDiv);
});

const NEXT_CRONO = "cronos5.html";
const PREV_CRONO = "cronos3.html";
const leftBtn = document.getElementById("scrollLeft");
const rightBtn = document.getElementById("scrollRight");
const scrollStep = 300;

leftBtn.addEventListener("click", () => {
    if (wrapper.scrollLeft <= 10 && PREV_CRONO) {
        window.location.href = PREV_CRONO;
    } else {
        wrapper.scrollLeft -= scrollStep;
    }
});
rightBtn.addEventListener("click", () => {
    const tl = document.getElementById("timeline");
    const maxScroll = tl.scrollWidth - wrapper.getBoundingClientRect().width + 120;
    const alFinal = wrapper.scrollLeft >= maxScroll - 20;
    if (alFinal && NEXT_CRONO) {
        window.location.href = NEXT_CRONO;
    } else {
        wrapper.scrollLeft += scrollStep;
    }
});
wrapper.addEventListener("scroll", () => {
    const alFinal = wrapper.scrollLeft + wrapper.clientWidth >= wrapper.scrollWidth - 10;
    rightBtn.style.background = alFinal ? "rgba(212,175,55,0.5)" : "rgba(0,0,0,0.7)";
    rightBtn.title = alFinal ? "Ir a Cronos 5 →" : "";
});

let isDown = false, startXpos, scrollLeftPos;
wrapper.addEventListener("mousedown", (e) => { isDown = true; startXpos = e.pageX - wrapper.offsetLeft; scrollLeftPos = wrapper.scrollLeft; });
wrapper.addEventListener("mouseleave", () => { isDown = false; });
wrapper.addEventListener("mouseup", () => { isDown = false; });
wrapper.addEventListener("mousemove", (e) => { if (!isDown) return; e.preventDefault(); const x = e.pageX - wrapper.offsetLeft; const walk = (x - startXpos) * 1.5; wrapper.scrollLeft = scrollLeftPos - walk; });
let touchStartX, touchScrollLeft;
wrapper.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].pageX - wrapper.offsetLeft; touchScrollLeft = wrapper.scrollLeft; }, { passive: true });
wrapper.addEventListener("touchmove", (e) => { const x = e.touches[0].pageX - wrapper.offsetLeft; const walk = (x - touchStartX) * 1.5; wrapper.scrollLeft = touchScrollLeft - walk; }, { passive: true });
