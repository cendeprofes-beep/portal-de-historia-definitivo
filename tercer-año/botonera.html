  html, body { margin: 0; min-height: 100%; background: #001b45; }

  .botonera {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    background: url("botonera-tercer-a%C3%B1o.png") center / 100% 100% no-repeat;
  }
  .botonera::after {
    content: ""; position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; height: 17.2%;
    background: linear-gradient(180deg, #001b45, #000d27);
    pointer-events: none;
  }
  .b { position: absolute; z-index: 2; left: 16.70%; width: 67.55%; display: block; }
  a.b:hover, a.b:focus-visible { background-color: rgba(255,255,255,.2); outline: none; }
  .nav {
    position: fixed; top: max(12px, env(safe-area-inset-top)); z-index: 20;
    width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(0,21,64,.9); border: 2px solid rgba(255,255,255,.85);
    transition: background .2s ease, transform .2s ease;
  }
  .nav:hover, .nav:focus-visible { background: #0a2f7a; transform: scale(1.08); outline: none; }
  .nav svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-izq { left: max(12px, env(safe-area-inset-left)); }
  .nav-der { right: max(12px, env(safe-area-inset-right)); }

    font-size: clamp(.85rem, 1.2vw, 1.15rem); line-height: 1.2; text-align: center;
    text-shadow: 0 2px 4px #000;
  }
  .extras {
    position: relative; z-index: 3; width: 86vw; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
    padding: 2px 0 10px;
  }
  .btn-app {
    display: block; overflow: hidden; border: 2px solid #f2bd4d; border-radius: 12px;
    background: #00153b; box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: filter .2s ease, transform .2s ease;
  }
  .btn-app img { display: block; width: 100%; height: auto; }
  .btn-app:hover, .btn-app:focus-visible { filter: brightness(1.2); transform: translateY(-2px); outline: 3px solid #fff; outline-offset: 2px; }

  @media (max-width: 700px) and (orientation: portrait) {
    .nav { width: 48px; height: 48px; }
    .nav svg { width: 26px; height: 26px; }
    .botonera {
      min-height: 100vh; min-height: 100svh; aspect-ratio: auto;
      background: linear-gradient(rgba(0,15,50,.88), rgba(0,20,67,.94)), url("botonera-tercer-a%C3%B1o.png") center / cover no-repeat;
      display: grid; align-content: center; gap: 12px; padding: 76px 14px 28px;
    }
    .botonera::after { display: none; }
    .botonera > .sr {
      position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal;
      margin: 0 0 8px; color: #ffe7aa; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 7vw, 1.9rem); line-height: 1; text-align: center;
      text-shadow: 0 2px 5px #000, 0 0 14px rgba(255,176,40,.45);
    }
    .b {
      position: relative; top: auto !important; left: auto; width: 100%; height: auto !important;
      min-height: 68px; padding: 12px 14px; border: 2px solid #f4bc48; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff2c4; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(.82rem, 4vw, 1.08rem); font-weight: 800; line-height: 1.15;
      text-align: center; text-decoration: none; box-shadow: inset 0 0 18px rgba(255,174,46,.2), 0 0 10px rgba(20,145,255,.32);
    }
    .b::before { content: attr(aria-label); }
    .b:nth-of-type(1), .b:nth-of-type(2) { background: linear-gradient(135deg, #08214d, #69400d); }
    .b:nth-of-type(3) { background: linear-gradient(135deg, #390713, #8b250c); }
    .b:nth-of-type(4) { background: linear-gradient(135deg, #061d17, #375d0b); }
    .b:nth-of-type(5) { background: linear-gradient(135deg, #2b1307, #84400c); }
    .b:nth-of-type(6) { background: linear-gradient(135deg, #031b43, #075d8c); }
    .b:nth-of-type(7) { background: linear-gradient(135deg, #210634, #662070); }
    a.b:hover, a.b:focus-visible, a.b:active { color: #fff; filter: brightness(1.22); outline: 3px solid #fff; outline-offset: 2px; }
    .credito {
      margin: 0; padding: 12px 14px 8px; background: #001b45;
      font-size: .9rem;
    }
    .extras {
      width: min(88%, 420px); grid-template-columns: 1fr; gap: 12px;
      margin: 0 auto; padding: 4px 0 30px;
    }
  }
</style>
