<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Historia</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #001b3d;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
    }

    main {
      width: 100%;
    }

    .landing-frame {
      position: relative;
      width: 100%;
    }

    .landing-page {
      display: block;
      width: 100%;
      height: auto;
    }

    .year-link {
      position: absolute;
      z-index: 1;
      width: 50%;
      height: 50%;
      display: block;
      transition: background-color .2s ease, box-shadow .2s ease;
    }

    .year-link:hover,
    .year-link:focus-visible {
      background-color: rgba(255, 255, 255, .13);
      box-shadow: inset 0 0 0 4px rgba(255, 226, 142, .9);
      outline: none;
    }

    .first-year  { top: 0; left: 0; }
    .second-year { top: 0; left: 50%; }
    .third-year  { top: 50%; left: 0; }
    .fourth-year { top: 50%; left: 50%; }

    .central-button {
      position: absolute;
      z-index: 3;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      transition: background-color .2s ease, box-shadow .2s ease;
    }

    .central-button:hover,
    .central-button:focus-visible {
      background-color: rgba(255, 255, 255, .12);
      box-shadow: 0 0 18px rgba(85, 207, 255, .9), inset 0 0 0 3px rgba(255, 226, 142, .85);
      outline: none;
    }

    .book-button {
      top: 2.2%;
      left: 42.8%;
      width: 14.4%;
      height: 16.8%;
    }

    .portal-title-button {
      top: 19.1%;
      left: 35.4%;
      width: 29.2%;
      height: 21.5%;
    }

    @media (orientation: portrait) {
      main {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="landing-frame">
      <img
        class="landing-page"
        src="landing-page.png"
        alt="Portal de Historia del profesor Claudio Sacco, organizado en primero, segundo, tercero y cuarto año"
        width="1672"
        height="941"
      >
      <a class="year-link first-year" href="primer-a%C3%B1o/botonera.html" aria-label="Ingresar a Historia de Primer Año"></a>
      <a class="year-link second-year" href="segundo-a%C3%B1o/botonera.html" aria-label="Ingresar a Historia de Segundo Año"></a>
      <a class="year-link third-year" href="tercer-a%C3%B1o/botonera.html" aria-label="Ingresar a Historia de Tercer Año"></a>
      <a class="year-link fourth-year" href="cuarto-a%C3%B1o/botonera.html" aria-label="Ingresar a Historia de Cuarto Año"></a>
      <a class="central-button book-button" href="cartografia_historica_interactiva.html" aria-label="Abrir la cartografía histórica interactiva" title="Cartografía histórica interactiva"></a>
      <a class="central-button portal-title-button" href="que-es-el-portal.html" aria-label="Conocer qué es el Portal de Historia diseñado por el profesor Claudio Sacco" title="¿Qué es el Portal de Historia?"></a>
    </div>
  </main>
</body>
</html>
